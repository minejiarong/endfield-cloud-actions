name: Daily Cloud Endfield

on:
  schedule:
    # 06:30 Asia/Shanghai (UTC+8) every day.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-cloud-endfield
  cancel-in-progress: false

jobs:
  dispatch-with-retries:
    name: Run Cloud Endfield with fresh-runner retries
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPO: ${{ github.repository }}
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Dispatch smoke workflow (initial attempt plus 3 retries)
        shell: bash
        run: |
          set -Eeuo pipefail

          max_attempts=4
          for attempt in $(seq 1 "$max_attempts"); do
            echo "Starting Cloud Endfield attempt ${attempt}/${max_attempts}"

            run_url="$(gh workflow run endfield-cloud-smoke.yml \
              --repo "$TARGET_REPO" \
              --ref "$TARGET_BRANCH" \
              -f advance_onboarding=true \
              -f api_level=35 \
              -f bootstrap_login=false \
              -f restore_state=true \
              -f run_maa_visit_friends=true)"
            run_id="${run_url##*/}"

            echo "Dispatched: ${run_url}"
            echo "### Attempt ${attempt}/${max_attempts}" >> "$GITHUB_STEP_SUMMARY"
            echo "${run_url}" >> "$GITHUB_STEP_SUMMARY"

            if gh run watch "$run_id" --repo "$TARGET_REPO" --exit-status; then
              echo "Cloud Endfield succeeded on attempt ${attempt}."
              echo "Result: success" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "Cloud Endfield attempt ${attempt} failed."
            echo "Result: failed" >> "$GITHUB_STEP_SUMMARY"

            kvm_failed="$(gh run view "$run_id" \
              --repo "$TARGET_REPO" \
              --json jobs \
              --jq '[.jobs[].steps[] | select(.name == "Allow access to KVM" and .conclusion == "failure")] | length')"

            if [[ "$kvm_failed" != "1" ]]; then
              echo "Failure was not caused by the KVM access step; no retry will be started."
              echo "Retry decision: stopped (non-KVM failure)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "KVM access failed; a fresh workflow run will be started."
            echo "Retry decision: retry (KVM failure)" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "Cloud Endfield failed after the initial attempt and 3 retries." >&2
          exit 1
