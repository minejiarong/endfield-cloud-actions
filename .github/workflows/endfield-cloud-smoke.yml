name: Cloud Endfield Android smoke test

"on":
  workflow_dispatch:
    inputs:
      advance_onboarding:
        description: Automatically advance known onboarding screens
        required: false
        type: boolean
        default: false
      api_level:
        description: Android API level to test
        required: false
        type: string
        default: "30"
      bootstrap_login:
        description: Publish a live QR code and save AVD state after login
        required: false
        type: boolean
        default: false
      restore_state:
        description: Restore the encrypted logged-in Android state
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: endfield-cloud-smoke
  cancel-in-progress: true

jobs:
  launch:
    name: Install and launch Cloud Endfield
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ADVANCE_ONBOARDING: ${{ inputs.advance_onboarding }}
      BOOTSTRAP_LOGIN: ${{ inputs.bootstrap_login }}
      RESTORE_STATE: ${{ inputs.restore_state }}
      STATE_REPO_SSH_KEY: ${{ secrets.STATE_REPO_SSH_KEY }}
      STATE_ENCRYPTION_PASSWORD: ${{ secrets.STATE_ENCRYPTION_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify private state repository access
        if: ${{ inputs.bootstrap_login || inputs.restore_state }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/endfield_state"
          printf '%s\n' "$STATE_REPO_SSH_KEY" > "$HOME/.ssh/endfield_state"
          ssh-keyscan -H github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/endfield_state -o IdentitiesOnly=yes" \
            git ls-remote git@github.com:minejiarong/endfield-cloud-state.git HEAD >/dev/null
          rm -f "$HOME/.ssh/endfield_state"

      - name: Restore encrypted Android state
        if: ${{ inputs.restore_state }}
        shell: bash
        run: bash scripts/restore-avd-state.sh

      - name: Record runner capabilities
        shell: bash
        run: |
          mkdir -p artifacts
          {
            uname -a
            lscpu
            df -h
            ls -la /dev/kvm || true
          } | tee artifacts/runner.txt

      - name: Allow access to KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Start Android and run smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 6G
          emulator-boot-timeout: 600
          emulator-options: >-
            -no-window
            -gpu swiftshader
            -no-snapshot
            -noaudio
            -no-boot-anim
            -camera-back none
            -camera-front none
            -no-metrics
          disable-animations: true
          script: bash scripts/endfield-cloud-smoke.sh

      - name: Encrypt and save logged-in Android state
        if: ${{ inputs.bootstrap_login }}
        shell: bash
        run: bash scripts/save-avd-state.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: endfield-cloud-smoke-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
